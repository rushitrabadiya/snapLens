<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Products - SnapLens</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="admin-header">
      <nav class="nav-container">
        <a href="admin-dashboard.html" class="logo">
          <i class="fas fa-camera"></i>
          SnapLens Admin
        </a>
        <button id="logoutBtn" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </nav>
    </header>

    <main class="admin-main">
      <div class="admin-container">
        <div class="admin-header">
          <h1>Product Management</h1>
          <button id="addProductBtn" class="primary-btn">
            <i class="fas fa-plus"></i> Add New Product
          </button>
        </div>

        <div class="product-filters">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="adminProductSearch"
              placeholder="Search products..."
            />
          </div>
          <select id="adminSortProducts">
            <option value="default">Sort by: Featured</option>
            <option value="name">Name: A to Z</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>

        <div class="products-table-container">
          <table class="products-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Featured</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <!-- Products will be loaded here dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add New Product</h2>
        <form id="productForm">
          <input type="hidden" id="productId" />
          <div class="form-group">
            <label for="productName">Product Name</label>
            <input type="text" id="productName" required />
          </div>
          <div class="form-group">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" required></textarea>
          </div>
          <div class="form-group">
            <label for="productPrice">Price (₹)</label>
            <input type="number" id="productPrice" step="0.01" required />
          </div>
          <div class="form-group">
            <label for="productCategory">Category</label>
            <input type="text" id="productCategory" required />
          </div>
          <div class="form-group">
            <label for="productImage">Image URL</label>
            <input type="text" id="productImage" required />
          </div>
          <div class="form-group">
            <label for="amazonLink">Amazon Link</label>
            <input type="text" id="amazonLink" required />
          </div>
          <div class="form-group checkbox">
            <label>
              <input type="checkbox" id="productFeatured" />
              Featured Product
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Save Product</button>
            <button type="button" class="secondary-btn" id="cancelBtn">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/products.js"></script>
    <script src="js/admin-products.js"></script>
  </body>
</html>
